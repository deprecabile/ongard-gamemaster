<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reimposta la tua password</title>
</head>
<body style="margin: 0; padding: 0; background-color: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"
       style="background-color: #1a1a2e; padding: 40px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0"
                   style="background-color: #16213e; border-radius: 12px; overflow: hidden; max-width: 600px;">
                <tr>
                    <td style="padding: 40px 40px 20px 40px; text-align: center;">
                        <h1 style="color: #e2b714; font-size: 28px; margin: 0;">Reimpostazione Password</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 0 40px 20px 40px; color: #d4d4d4; font-size: 16px; line-height: 1.6;">
                        <p style="margin: 0 0 16px 0;">È stata richiesta la reimpostazione della password per l'account:
                            <strong style="color: #ffffff;">{{username}}</strong>.</p>
                        <p style="margin: 0 0 24px 0;">Clicca sul link seguente per reimpostare la tua password:</p>
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding: 0 40px 30px 40px;">
                        <a href="{{resetUrl}}"
                           style="display: inline-block; padding: 14px 32px; background-color: #e2b714; color: #1a1a2e; text-decoration: none; font-weight: bold; font-size: 16px; border-radius: 8px;">Reimposta
                            Password</a>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 0 40px 40px 40px; color: #8888a0; font-size: 13px; line-height: 1.5;">
                        <p style="margin: 0;">Se non hai richiesto tu questa operazione, ignora semplicemente questa
                            email. La tua password rimarrà invariata.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
